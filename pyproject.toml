[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camtraps-frames"
version = "0.1.0"
description = "Extraction de frames depuis des vidéos de pièges photographiques, avec métadonnées EXIF datées correctement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Quentin" }]

dependencies = [
    "opencv-python-headless>=4.5",
    "piexif>=1.1.3",
    "Pillow>=9.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
notebook = ["ipython"]
dev = ["pytest"]

# Permet d'appeler `camtraps-frames --help` depuis un terminal après installation
[project.scripts]
camtraps-frames = "camtraps_frames.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
